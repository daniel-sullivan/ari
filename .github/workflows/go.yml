name: Go

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: lint
      uses: golangci/golangci-lint-action@v3.7.0
      with:
        version: v1.55.2
        args: --timeout 10m ./...

    - name: Build API
      run: go build -v ./ ./stdbus ./rid

    - name: Build Clients
      run: go build -v ./client/native ./client/arimocks

    - name: Build Extensions
      run: go build -v ./ext/...

    - name: Test
      run: go test -v ./...

    - name: Test connection race
      run: go test -race -run '^TestConnectCloseConnectedRace$' ./client/native
